text: |
  "I'm not a developer, so I can't contribute to open source." If you've ever
  thought that about OpenTelemetry, our next OTel in Practice is for you.

  Diana Todea (Localization SIG Maintainer and 2025 OTel Community Award
  winner) shows what localization work looks like and how to get started.

  📅 Oct 13 | 9 AM PDT
  🔗 https://opentelemetry.io/community/otel-in-practice/
